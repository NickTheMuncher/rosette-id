# currentlyt not really intended to be used like a python project, but i'm adding a pyproject.toml file so I can use ruff
[tool.ruff]
exclude = [".git", "node_modules", "venv"]
line-length = 88
target-version = ["py310"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
